name: relbench_v1
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyter
  - numpy
  - scipy
  - pandas=2.3.3
  - scikit-learn
  - matplotlib
  - graphviz          # `dot` binary, for schema visualizations (rdl_explain.explain.viz)
  - pip:
      - torch==2.4.0
      - torch-geometric
      - torch-sparse
      - torch-scatter
      - torch-cluster
      - torch-spline-conv
      - pyg-lib
      - pytorch_frame
      - pyarrow==22.0.0
      - relbench==1.1.0
      - sentence-transformers
      - graphviz        # python wrapper for the dot binary above
      - --find-links https://data.pyg.org/whl/torch-2.4.0+cu124.html
      - pydantic
      - -e .